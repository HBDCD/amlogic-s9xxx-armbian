name: Build Armbian

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      # ✅ 强制使用官方 GitHub
      - name: Force use official GitHub source
        run: |
          git config --global --unset-all url.http://git-mirror.ace-research.openai.org/github.com/.insteadof || true
          git config --global url."https://github.com/".insteadOf "http://git-mirror.ace-research.openai.org/github.com/"
          git config --global url."https://github.com/".insteadOf "https://git-mirror.ace-research.openai.org/github.com/"
          git config --global --list

      # ✅ 安装基础依赖
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget unzip \
            build-essential qemu-user-static \
            binfmt-support

      # ✅ 注册 binfmt
      - name: Enable binfmt
        run: |
          sudo update-binfmts --enable

      # ✅ 手动 clone ophub 仓库（避免 Action 内部 fetch 失败）
      - name: Clone ophub repository
        run: |
          git clone --depth=1 https://github.com/ophub/amlogic-s9xxx-armbian.git

      # ✅ 编译
      - name: Build Armbian
        run: |
          cd amlogic-s9xxx-armbian
          sudo ./compile.sh \
            BOARD=odroidn2 \
            BRANCH=current \
            RELEASE=noble \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no
