name: Build Armbian OdroidN2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      # ===== 清理没有 Release 的孤儿 tag =====
      - name: Cleanup orphan tags (no release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Fetching all tags..."
          all_tags=$(gh api repos/${{ github.repository }}/tags --paginate | jq -r '.[].name')

          echo "Fetching all release tags..."
          release_tags=$(gh api repos/${{ github.repository }}/releases --paginate | jq -r '.[].tag_name')

          for tag in $all_tags; do
            if ! echo "$release_tags" | grep -qx "$tag"; then
              echo "Deleting orphan tag: $tag"
              gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/$tag
            fi
          done

          echo "Orphan tag cleanup finished."

      - name: Set build date tag
        id: tag
        run: |
          TAG=$(date +%Y%m%d)
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create and push git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Automated build $TAG"
          git push origin "$TAG"

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget xz-utils \
            build-essential gcc g++ \
            libncurses-dev flex bison \
            libssl-dev bc rsync kmod \
            ccache python3 python3-pip \
            qemu-user-static debootstrap \
            binfmt-support device-tree-compiler

      - name: Clone Armbian build repo (main branch only)
        run: |
          git clone --depth=1 --branch=v25.05 https://github.com/armbian/build.git

      - name: Build Armbian for Odroid N2 (Debian CLI)
        working-directory: build
        run: |
          ./compile.sh \
            BOARD=odroidn2 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no

      - name: Upload image to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Armbian OdroidN2 Debian CLI ${{ env.TAG }}
          files: |
            build/output/images/*

