name: Build Armbian OdroidN2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      # ===== 每次运行都生成唯一 tag =====
      - name: Set unique build tag
        run: |
          # 使用日期 + GitHub Actions 内置 run number 保证唯一
          TAG=$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Using tag: $TAG"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Automated build $TAG"
          git push origin "$TAG"

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget xz-utils \
            build-essential gcc g++ \
            libncurses-dev flex bison \
            libssl-dev bc rsync kmod \
            ccache python3 python3-pip \
            qemu-user-static debootstrap \
            binfmt-support device-tree-compiler

      - name: Clone Armbian build repo (main branch only)
        run: |
          git clone --depth=1 --branch=v25.05 https://github.com/armbian/build.git

      - name: Build Armbian for Odroid N2 (Debian CLI)
        working-directory: build
        run: |
          ./compile.sh \
            BOARD=odroidn2 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no

      # ===== 仅压缩镜像，不生成校验 =====
# ===== 仅压缩镜像，不生成校验 =====
      - name: Compress image
        working-directory: build/output/images
        run: |
          set -e
          for img in *.img; do
            echo "Compressing $img ..."
            # 1. 使用 sudo 确保能读取 root 权限生成的镜像
            # 2. 使用 -c 将压缩流导向新文件，避免 xz 尝试删除原文件时权限不足
            # 3. 这样写比直接 xz $img 更稳妥
            sudo sh -c "xz -c -T0 -6 '$img' > '${img}.xz'"
            
            # 压缩成功后删除原图（可选）
            sudo rm "$img"
          done
      - name: Upload compressed image to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Armbian OdroidN2 Debian CLI ${{ env.TAG }}
          files: |
            build/output/images/*.img.xz
