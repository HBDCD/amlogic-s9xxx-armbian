name: Build Armbian OdroidN2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      # 1. 释放磁盘空间 (解决编译大镜像空间不足的隐患)
# 🌟 修改后的释放磁盘空间步骤
      - name: Free Disk Space
        run: |
          sudo docker image prune -a -f
          # 只删除大目录，不碰 /etc/apt/ 软件源
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          # 清理 apt 缓存
          sudo apt-get clean
          # 2. 生成版本标签
      - name: Set unique build tag
        run: |
          TAG=$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Using tag: $TAG"

      # 3. 推送 Git Tag
      - name: Create and push git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Automated build $TAG"
          git push origin "$TAG"

      # 4. 安装 Armbian 编译必需的依赖
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget xz-utils \
            build-essential gcc g++ \
            libncurses-dev flex bison \
            libssl-dev bc rsync kmod \
            ccache python3 python3-pip \
            qemu-user-static debootstrap \
            binfmt-support device-tree-compiler

      # 5. 克隆 Armbian 源码
      - name: Clone Armbian build repo
        run: |
          git clone --depth=1 --branch=v25.05 https://github.com/armbian/build.git

      # 6. 执行编译 (Odroid N2)
      - name: Build Armbian for Odroid N2 (Debian CLI)
        working-directory: build
        run: |
          sudo ./compile.sh \
            BOARD=odroidn2 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no

      # 7. 安全压缩镜像 (修复了之前的 xz 参数错误和权限问题)
      - name: Compress image
        working-directory: build/output/images
        run: |
          set -e
          shopt -s nullglob
          for img in *.img; do
            echo "Compressing $img ..."
            # 使用 sudo 配合重定向，彻底解决权限和 unrecognized option 报错
            sudo sh -c "xz -c -T0 -6 '$img' > '${img}.xz'"
            # 压缩一个删一个，节省磁盘空间
            sudo rm -f "$img"
          done

      # 8. 上传到 Release
      - name: Upload compressed image to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Armbian OdroidN2 Debian CLI ${{ env.TAG }}
          files: build/output/images/*.img.xz

